name: Windows MSI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "test/**", "package*.json", ".github/workflows/windows-msi.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install test video inspector
        run: choco install ffmpeg --yes --no-progress
      - run: npm test
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-windows.cjs
      - name: Install, launch and uninstall MSI
        shell: pwsh
        run: ./scripts/test-windows-msi.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-mv-windows-msi
          if-no-files-found: error
          path: |
            dist/*.msi
            docs/test-results/windows-package.json
            docs/test-results/windows-msi.json
            dist/msi-*.log
